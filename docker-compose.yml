services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - "2333" # only reachable by other containers on this network, not your host
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2333/v4/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      
  whisper:
    build:
      context: .
      target: whisper-service
    restart: unless-stopped
    expose:
      - "8080" # only reachable by other containers on this network, not your host

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama # persists downloaded models across restarts
    expose:
      - "11434" # only reachable by other containers on this network, not your host

  teno:
    build:
      context: .
      target: teno
    env_file: .env
    depends_on:
      - lavalink
      - whisper
      - ollama
    restart: unless-stopped

volumes:
  ollama-models:
