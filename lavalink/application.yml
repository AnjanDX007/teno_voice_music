server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass" # change this, also update .env to match
    sources:
      youtube: false # built-in source is disabled; the plugin below replaces it
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"

plugins:
  youtube:
    enabled: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB

logging:
  level:
    root: INFO
    lavalink: INFO
